# 1. Bắt cổng động do Cloud cấp phát (tự đổi sang 10000, 8080, v.v.)
server.port=${PORT:8080}

# 2. Cơ sở dữ liệu Online:
# Dùng H2 In-Memory chạy trên RAM cực nhanh, không tốn tiền thuê database
spring.datasource.url=${DB_URL:jdbc:h2:mem:tri_nghe_lang_chau_tho_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 3. Hibernate tự sinh bảng và bật tiếng Việt UTF-8
spring.jpa.hibernate.ddl-auto=update
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# H2 Console (tùy chọn)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

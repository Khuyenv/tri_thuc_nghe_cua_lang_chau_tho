spring.application.name=tri_nghe_lang_chau_tho

# Cấu hình cổng cục bộ
server.port=8080

# Cấu hình UTF-8 chống vỡ font tiếng Việt
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Cấu hình kết nối MS SQL Server cục bộ (Chạy Offline)
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=tri_nghe_lang_chau_tho_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
